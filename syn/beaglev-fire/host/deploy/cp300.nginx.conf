# The stock web server (port 80) proxies /cp300/ to the CP-300 daemon, WebSocket included.
location = /cp300 { return 301 /cp300/; }
location /cp300/ {
	proxy_pass http://127.0.0.1:8300/;
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";
	proxy_set_header Host $host;
	proxy_read_timeout 1h;
	client_max_body_size 4m;       # disk images and ROMs are uploaded with PUT
}

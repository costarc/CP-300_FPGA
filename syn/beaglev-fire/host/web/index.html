<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CP-300 on BeagleV-Fire</title>
<style>
:root { --bg:#12151a; --panel:#1b2027; --line:#2c343f; --fg:#d8dee6; --dim:#8a96a5; --acc:#46d68c; --warn:#e5a23c; --bad:#e5604f; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 12px 16px 40px; display:grid; gap:12px; }
header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
h1 { font-size:18px; margin:0; font-weight:600; }
#conn { font-size:12px; color:var(--dim); }
#conn.on { color:var(--acc); }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
#screenwrap { background:#000; border-radius:6px; padding:0; line-height:0; }
/* the 512x192 picture is shown on a 4:3 tube, as on the real machine: pixels are taller than wide (1024 x 768 = 2x by 4x) */
canvas { width:100%; max-width:1024px; height:auto; image-rendering:pixelated; aspect-ratio: 4 / 3; background:#000; display:block; border-radius:6px; margin:0 auto; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
button, select { background:#252c35; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; cursor:pointer; }
button:hover { border-color:var(--acc); }
button.on { background:var(--acc); color:#06210f; border-color:var(--acc); }
h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:0 0 8px; font-weight:600; }
.drives { display:grid; grid-template-columns: repeat(auto-fit, minmax(230px,1fr)); gap:8px; }
.drive { border:1px dashed var(--line); border-radius:6px; padding:8px; min-height:74px; }
.drive.over { border-color:var(--acc); background:#1d2a24; }
.drive b { display:block; }
.drive .nm { color:var(--dim); font-size:12px; word-break:break-all; min-height:18px; }
.small { font-size:12px; color:var(--dim); }
#osk { display:grid; gap:4px; user-select:none; touch-action:manipulation; }
#osk .r { display:flex; gap:4px; justify-content:center; }
#osk button { min-width:34px; padding:8px 6px; }
#osk button.down { background:var(--acc); color:#06210f; }
#msg { min-height:20px; font-size:12px; }
#msg.err { color:var(--bad); }
</style>
</head>
<body>
<main>
<header>
  <h1>CP-300</h1><span id="conn">connecting…</span><span class="small" id="fps"></span>
</header>

<div class="panel" id="screenwrap"><canvas id="scr" width="512" height="192" tabindex="0" aria-label="CP-300 screen"></canvas></div>
<div id="msg"></div>

<div class="panel">
  <div class="row">
    <button id="bRun">Run</button>
    <button id="bReset">Reset</button>
    <button id="bTurbo">Turbo</button>
    <button id="bWp">Write-protect disks</button>
    <button id="bSound">Sound</button>
    <label class="small">Colour
      <select id="phos"><option value="#e8e8e8">White</option><option value="#40ff60" selected>Green</option><option value="#ffb000">Amber</option></select>
    </label>
    <span class="small">Click the screen and type: the keys go to the CP-300. Esc = BREAK, Backspace = left arrow.</span>
  </div>
</div>

<div class="panel">
  <h2>Disk drives — drop a .dsk / .dmk / .hfe / .jv1 / .jv3 file on a drive</h2>
  <div class="drives" id="drives"></div>
</div>

<div class="panel">
  <h2>ROMs (kept on the board, never in the bitstream)</h2>
  <div class="row">
    <label>System ROM, 16384 bytes <input type="file" id="romSys"></label>
    <label>Character generator, 2048 bytes <input type="file" id="romChar"></label>
    <span class="small" id="romState"></span>
  </div>
</div>

<div class="panel"><h2>On-screen keyboard</h2><div id="osk"></div></div>
</main>

<script>
// the page may be served under a prefix (the stock web server proxies /cp300/): all URLs are relative to it
const BASE = location.pathname.replace(/[^\/]*$/, "");

"use strict";
// ---- CP-300 keyboard matrix: bit = 8 * row + column ----
const ROWS = ["@ABCDEFG", "HIJKLMNO", "PQRSTUVW", "XYZ", "01234567", "89:;,-./"];
const NAMED = { ENTER:48, CLEAR:49, BREAK:50, UP:51, DOWN:52, LEFT:53, RIGHT:54, SPACE:55, LSHIFT:56, RSHIFT:57 };
const CHAR = {};
ROWS.forEach((r, i) => [...r].forEach((c, j) => CHAR[c] = 8 * i + j));
const SHIFTED = { "!":"1", '"':"2", "#":"3", "$":"4", "%":"5", "&":"6", "'":"7", "(":"8", ")":"9", "*":":", "+":";", "<":",", "=":"-", ">":".", "?":"/" };

// the bits a browser key event stands for, as the CP-300 types it
function bitsFor(e) {
  const k = e.key;
  if (k.length === 1) {
    const u = k.toUpperCase();
    if (u in CHAR) return [CHAR[u]];                       // letters are capitals, as the ROM prints them
    if (k in SHIFTED) return [CHAR[SHIFTED[k]], NAMED.LSHIFT];
    if (k === " ") return [NAMED.SPACE];
    return [];
  }
  switch (k) {
    case "Enter": return [NAMED.ENTER];
    case "Escape": case "Pause": return [NAMED.BREAK];
    case "Home": case "Delete": return [NAMED.CLEAR];
    case "Backspace": case "ArrowLeft": return [NAMED.LEFT];
    case "ArrowRight": return [NAMED.RIGHT];
    case "ArrowUp": return [NAMED.UP];
    case "ArrowDown": return [NAMED.DOWN];
    case "Shift": return [e.code === "ShiftRight" ? NAMED.RSHIFT : NAMED.LSHIFT];
  }
  return [];
}

let ws = null, state = null, keyBits = 0n;
const held = new Map();                                    // key id -> bits
const $ = id => document.getElementById(id);
function say(t, err) { const m = $("msg"); m.textContent = t || ""; m.className = err ? "err" : ""; }

function sendKeys() {
  let v = 0n;
  for (const bits of held.values()) for (const b of bits) v |= 1n << BigInt(b);
  if (v === keyBits) return;
  keyBits = v;
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ keys: v.toString(16).padStart(16, "0") }));
}
function ctrl(c) { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ ctrl: c })); }

// ---- physical keyboard
const scr = $("scr");
scr.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const bits = bitsFor(e); if (!bits.length) return;
  e.preventDefault();
  if (!e.repeat) { held.set("k:" + e.code, bits); sendKeys(); }
});
scr.addEventListener("keyup", e => { if (held.delete("k:" + e.code)) { e.preventDefault(); sendKeys(); } });
scr.addEventListener("blur", () => { for (const k of [...held.keys()]) if (k.startsWith("k:")) held.delete(k); sendKeys(); });
scr.addEventListener("click", () => scr.focus());

// ---- on-screen keyboard
const OSK = [
  ["1","2","3","4","5","6","7","8","9","0",":","-","BREAK"],
  ["CLEAR","Q","W","E","R","T","Y","U","I","O","P","@"],
  ["A","S","D","F","G","H","J","K","L",";","ENTER"],
  ["LSHIFT","Z","X","C","V","B","N","M",",",".","/","RSHIFT"],
  ["SPACE","LEFT","UP","DOWN","RIGHT"],
];
(function buildOsk() {
  const host = $("osk");
  OSK.forEach(row => {
    const r = document.createElement("div"); r.className = "r";
    row.forEach(name => {
      const b = document.createElement("button");
      b.textContent = name.length > 1 ? name[0] + name.slice(1).toLowerCase() : name;
      const bit = name in NAMED ? NAMED[name] : CHAR[name];
      const id = "o:" + name;
      const down = () => { held.set(id, [bit]); b.classList.add("down"); sendKeys(); };
      const up = () => { held.delete(id); b.classList.remove("down"); sendKeys(); };
      b.addEventListener("pointerdown", e => { e.preventDefault(); b.setPointerCapture(e.pointerId); down(); });
      b.addEventListener("pointerup", up); b.addEventListener("pointercancel", up);
      r.appendChild(b);
    });
    host.appendChild(r);
  });
})();

// ---- picture
const g = scr.getContext("2d");
const img = g.createImageData(512, 192);
let prev = null, ink = [0x40, 0xff, 0x60], frames = 0, lastQueue = Promise.resolve();
function setInk(hex) { ink = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)); if (prev) draw(prev); }
function draw(fb) {
  const d = img.data;
  for (let i = 0, p = 0; i < 12288; i++) {
    const v = fb[i];
    for (let b = 0; b < 8; b++, p += 4) {
      const on = (v >> b) & 1;
      d[p] = on ? ink[0] : 0; d[p + 1] = on ? ink[1] : 0; d[p + 2] = on ? ink[2] : 0; d[p + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
}
async function inflate(bytes) {
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
function onFrame(buf) {
  const kind = buf[3], z = buf.subarray(4);
  lastQueue = lastQueue.then(async () => {
    const data = await inflate(z);
    if (kind === 1 && prev) for (let i = 0; i < data.length; i++) data[i] ^= prev[i];
    prev = data; frames++; draw(data);
  }).catch(() => { prev = null; });
}
setInterval(() => { $("fps").textContent = ws && ws.readyState === 1 ? frames + " fps" : ""; frames = 0; }, 1000);

// ---- audio: the core sends speaker level changes with microsecond stamps
let ac = null, soundOn = false, playhead = 0, lastT = null, lastLevel = 0x10;
function audioEvents(buf) {
  if (!soundOn || !ac) return;
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength), n = (buf.length - 1) / 6, rate = ac.sampleRate;
  if (playhead < ac.currentTime) { playhead = ac.currentTime + 0.06; lastT = null; }   // a gap: start over, silent
  const chunks = []; let total = 0;
  for (let i = 0; i < n; i++) {
    const t = dv.getUint32(1 + 6 * i, true), lvl = dv.getUint16(5 + 6 * i, true);
    if (lastT !== null) {
      const dt = (t - lastT) & 0x7fffff, cnt = Math.min(Math.round(dt * rate / 1e6), rate);
      if (cnt > 0) { chunks.push([cnt, lastLevel]); total += cnt; }
    }
    lastT = t; lastLevel = lvl;
  }
  if (!total) return;
  const ab = ac.createBuffer(1, total, rate), ch = ab.getChannelData(0);
  let o = 0;
  for (const [cnt, lvl] of chunks) { ch.fill((lvl - 16) / 16 * 0.25, o, o + cnt); o += cnt; }
  const src = ac.createBufferSource(); src.buffer = ab; src.connect(ac.destination);
  src.start(playhead); playhead += total / rate;
}

// ---- connection
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + BASE + "ws");
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { $("conn").textContent = "connected"; $("conn").className = "on"; prev = null; keyBits = -1n; sendKeys(); };
  ws.onclose = () => { $("conn").textContent = "disconnected, retrying…"; $("conn").className = ""; setTimeout(connect, 1500); };
  ws.onmessage = ev => {
    if (typeof ev.data === "string") { showState(JSON.parse(ev.data)); return; }
    const b = new Uint8Array(ev.data);
    if (b[0] === 1) onFrame(b); else if (b[0] === 2) audioEvents(b);
  };
}

// ---- state, drives, ROMs
function showState(s) {
  state = s;
  $("bRun").classList.toggle("on", !!s.run); $("bRun").textContent = s.run ? "Running" : "Run";
  $("bTurbo").classList.toggle("on", !!s.turbo);
  $("bWp").classList.toggle("on", !!s.wp);
  $("romState").textContent = (s.roms.system && s.roms.chargen) ? "both ROMs loaded" : "load both ROMs to start";
  const host = $("drives"); host.textContent = "";
  s.drives.forEach((d, n) => {
    const el = document.createElement("div"); el.className = "drive";
    const nm = document.createElement("div"); nm.className = "nm";
    nm.textContent = d.size ? d.name + " (" + Math.round(d.size / 1024) + " KB)" : "empty";
    const b = document.createElement("b"); b.textContent = "Drive " + n;
    const row = document.createElement("div"); row.className = "row";
    if (d.size) {
      const dl = document.createElement("button"); dl.textContent = "Download";
      dl.onclick = () => { location.href = BASE + "api/disk/" + n; };
      const ej = document.createElement("button"); ej.textContent = "Eject";
      ej.onclick = () => fetch(BASE + "api/disk/" + n, { method: "DELETE" });
      row.append(dl, ej);
    }
    const pick = document.createElement("input"); pick.type = "file"; pick.style.maxWidth = "170px";
    pick.onchange = () => pick.files[0] && putDisk(n, pick.files[0]);
    row.append(pick);
    el.append(b, nm, row);
    el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("over"); });
    el.addEventListener("dragleave", () => el.classList.remove("over"));
    el.addEventListener("drop", e => { e.preventDefault(); el.classList.remove("over"); if (e.dataTransfer.files[0]) putDisk(n, e.dataTransfer.files[0]); });
    host.appendChild(el);
  });
}
async function putDisk(n, f) {
  say("Loading " + f.name + "…");
  const r = await fetch(BASE + "api/disk/" + n + "?name=" + encodeURIComponent(f.name), { method: "PUT", body: await f.arrayBuffer() });
  const j = await r.json().catch(() => ({}));
  say(r.ok ? f.name + " mounted in drive " + n + (j.info && j.info.warnings && j.info.warnings.length ? " (" + j.info.warnings.length + " warnings)" : "")
           : "Could not mount: " + (j.error || r.status), !r.ok);
}
async function putRom(kind, f) {
  const r = await fetch(BASE + "api/rom/" + kind, { method: "PUT", body: await f.arrayBuffer() });
  const j = await r.json().catch(() => ({}));
  say(r.ok ? kind + " ROM loaded" : (j.error || "ROM rejected"), !r.ok);
}
$("romSys").onchange = e => e.target.files[0] && putRom("system", e.target.files[0]);
$("romChar").onchange = e => e.target.files[0] && putRom("chargen", e.target.files[0]);
$("bRun").onclick = () => ctrl({ run: state && state.run ? 0 : 1 });
$("bReset").onclick = () => ctrl({ reset: 1 });
$("bTurbo").onclick = () => ctrl({ turbo: state && state.turbo ? 0 : 1 });
$("bWp").onclick = () => ctrl({ wp: state && state.wp ? 0 : 1 });
$("bSound").onclick = async () => {
  soundOn = !soundOn; $("bSound").classList.toggle("on", soundOn);
  if (soundOn) { ac = ac || new AudioContext(); await ac.resume(); playhead = 0; lastT = null; }
};
$("phos").onchange = e => { setInk(e.target.value); try { localStorage.setItem("cp300.phos", e.target.value); } catch (x) {} };
try { const p = localStorage.getItem("cp300.phos"); if (p) $("phos").value = p; } catch (x) {}
setInk($("phos").value);
draw(new Uint8Array(12288));
connect();
</script>
</body>
</html>
